name: Run Tests

on:
  push:
    branches:
      - master
  pull_request:
    types: ['opened', 'reopened', 'synchronize']

jobs:
  test:
    strategy:
      matrix:
        nodejs: [ '22', '24', '26' ]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pull-requests: write
    steps:
      - name: Cancel Previous Runs
        # tag 0.13.1
        uses: styfle/cancel-workflow-action@d07a454dad7609a92316b57b23c9ccfd4f59af66
        with:
          access_token: ${{ github.token }}
      - name: Checkout
        # tag v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup pnpm
        # tag v3.1.2
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e
        with:
          require-lockfile: true
          runtime: node@${{ matrix.nodejs }}
      - name: Run linter
        run: pnpm lint
      - name: Run tests
        run: pnpm test
