name: Create VEX

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

jobs:
  create-vex:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout
        # tag v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # v3.2.0
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: 4830546
          private-key: ${{ secrets.VEX_APP_PRIVATE_KEY }}
          repositories: "losant-vexhub"

      - uses: Losant/losant-vex-tools/create-vex@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VEX_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          vex_repo: Losant/losant-vexhub
          min_severity: "MEDIUM"